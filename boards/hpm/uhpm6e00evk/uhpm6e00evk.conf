# HPM6E00EVK — 芯片层配置
CONFIG_DMAV2_HPMICRO=y
CONFIG_ROM_START_OFFSET=0x3100
CONFIG_HPM6E_SINGLE_PRECISION_FPU=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PMP_STACK_GUARD_MIN_SIZE=256

# fatal 异常栈帧转储
CONFIG_DUST_FATAL_ESF_HPM=y

# EtherCAT 从站测试（TRD_TEST select DUST_COM_ETHERCAT + HPM_ESC）
CONFIG_TRD_TEST=y

# 本板 dts 没有 heart_beat 节点、也没有 remote_uart alias，关掉这两条线程
CONFIG_TRD_GPIO=n
CONFIG_TRD_REMOTE=n

# 板上有 CAT24C128 I2C EEPROM：SII 存芯片里，不用 Flash 模拟
CONFIG_HPM_ESC_EEPROM_EMULATION=n

# ESC EEPROM 的 I2C1（CAT24C128 预烧通道）
CONFIG_I2C=y
