# HPM6E00EVK — 芯片层配置
CONFIG_DMAV2_HPMICRO=y
CONFIG_ROM_START_OFFSET=0x3100
CONFIG_HPM6E_SINGLE_PRECISION_FPU=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PMP_STACK_GUARD_MIN_SIZE=256

# ESC 使用 PLIC IRQ 133～136；192 项加一级中断表偏移 12，不超过 NUM_IRQS=256
CONFIG_MAX_IRQ_PER_AGGREGATOR=192

# fatal 异常栈帧转储
CONFIG_DUST_FATAL_ESF_HPM=y

# 板卡底层 HAL：HPMicro 片内 ESC
CONFIG_DUST_ECAT_HAL_HPM=y


