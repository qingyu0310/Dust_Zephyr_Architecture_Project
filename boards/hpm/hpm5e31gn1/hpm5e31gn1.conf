# HPM5E31GN1 project configuration
CONFIG_DMA=y
CONFIG_DMAV2_HPMICRO=y
CONFIG_CAN=y
CONFIG_MCAN_HPMICRO=y
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_PMP_STACK_GUARD_MIN_SIZE=256
CONFIG_DUST_FATAL_ESF_HPM=y
CONFIG_HPM5E_SINGLE_PRECISION_FPU=y
CONFIG_ROM_START_OFFSET=0x3100
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# This board profile enables the requested CAN test and UART shell only.
CONFIG_TRD_GPIO=n
CONFIG_TRD_REMOTE=n

# 板上无外部 EEPROM：SII 用 Flash 分区模拟
CONFIG_HPM_ESC_EEPROM_EMULATION=y
