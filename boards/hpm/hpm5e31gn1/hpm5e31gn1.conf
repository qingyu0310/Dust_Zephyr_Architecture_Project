# HPM5E31GN1 project configuration
# 只写本板独有的硬件参数；外设符号（DMA/SERIAL/CAN/GPIO…）由业务门禁 select。

CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_HPM5E_SINGLE_PRECISION_FPU=y
CONFIG_PMP_STACK_GUARD_MIN_SIZE=256
CONFIG_ROM_START_OFFSET=0x3100

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# 本板是 HPM 片内 ESC
CONFIG_DUST_ECAT_HAL_HPM=y

CONFIG_DUST_FATAL_ESF_HPM=y
