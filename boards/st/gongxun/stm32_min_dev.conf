# STM32F103C8T6 — 芯片层配置
CONFIG_DMA_STM32=y
CONFIG_DUST_USB_DEVICE_HAL_STM32=y

# F103C8 只有 20KB RAM（prj.conf 的通用值是按大 RAM 板卡定的），这块按需砍
# 堆：整个工程没有 k_malloc / malloc 调用
CONFIG_HEAP_MEM_POOL_SIZE=0
# main 只跑启动期 init 链
CONFIG_MAIN_STACK_SIZE=2048
# 没用 k_work，系统工作队列栈砍半
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
